name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # typecheck + test + 文档交叉引用。S2 的桩 provider 测试无网络依赖，可安全在 CI 跑。
      - run: npm run check
